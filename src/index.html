<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        API Security Scanner
    </title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="main-container">

        <div class="scanner-card">

            <h1>
                API Security Scanner
            </h1>

            <p class="subtitle">
                Scan websites for security headers
                and HTTPS protection
            </p>

            <!-- Tabs -->
            <div class="tabs">

                <button id="apiTab" class="tab-btn active" onclick="showApiScanner()">

                    Headers Scanner

                </button>

                <button id="swaggerTab" class="tab-btn" onclick="showSwaggerScanner()">

                    Swagger API Scanner

                </button>

                <button id="jwtTab" class="tab-btn" onclick="showJwtScanner()">

                    JWT Scanner

                </button>

            </div>

            <!-- Header Scanner -->
            <div id="apiScanner">

                <input type="text" id="url" placeholder="Enter Website URL">

                <button onclick="scanApi()">
                    Scan Headers
                </button>

                <button id="apiPdfBtn" onclick="downloadApiPdf()" style="display:none;">

                    Download PDF

                </button>

            </div>

            <!-- Swagger Scanner -->
            <div id="swaggerScanner" style="display:none;">

                <input type="text" id="swaggerUrl" placeholder="Enter Swagger/OpenAPI URL">

                <button onclick="scanSwagger()">
                    Scan Swagger API
                </button>

                <button id="swaggerPdfBtn" onclick="downloadSwaggerPdf()" style="display:none;">

                    Download PDF

                </button>

            </div>
            <!-- JWT Scanner -->
            <div id="jwtScanner" style="display:none;">

                <textarea id="jwtToken" placeholder="Paste JWT Token Here" rows="6"
                    style="width:100%; margin-bottom:10px;">
                </textarea>

                <button onclick="scanJwt()">

                    Analyze JWT

                </button>

            </div>

            <div id="loader" class="loader">

            </div>

            <div id="result">

            </div>

        </div>

    </div>

    <footer>

        Developed by Swamy Dandu

    </footer>

    <script src="script.js"></script>

    <script>

        function showApiScanner() {

            document.getElementById("apiScanner")
                .style.display = "block";

            document.getElementById("swaggerScanner")
                .style.display = "none";

            document.getElementById("jwtScanner")
                .style.display = "none";

            document.getElementById("apiTab")
                .classList.add("active");

            document.getElementById("swaggerTab")
                .classList.remove("active");

            document.getElementById("jwtTab")
                .classList.remove("active");

            document.getElementById("result")
                .innerHTML = "";
        }

        function showSwaggerScanner() {

            document.getElementById("apiScanner")
                .style.display = "none";

            document.getElementById("swaggerScanner")
                .style.display = "block";

            document.getElementById("jwtScanner")
                .style.display = "none";

            document.getElementById("swaggerTab")
                .classList.add("active");

            document.getElementById("apiTab")
                .classList.remove("active");

            document.getElementById("jwtTab")
                .classList.remove("active");

            document.getElementById("result")
                .innerHTML = "";
        }

        function showJwtScanner() {

            document.getElementById("apiScanner").style.display = "none";
            document.getElementById("swaggerScanner").style.display = "none";
            document.getElementById("jwtScanner").style.display = "block";

            document.getElementById("jwtTab").classList.add("active");
            document.getElementById("apiTab").classList.remove("active");
            document.getElementById("swaggerTab").classList.remove("active");

            document.getElementById("result").innerHTML = "";
        }

    </script>

</body>

</html>

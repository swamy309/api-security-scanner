<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        API Security Scanner
    </title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header class="header">

        <div class="logo">
            🛡 CyberRadar
        </div>

        <div class="header-right">
            Scan • Detect • Secure
        </div>

    </header>

    <div class="main-container">

        <div class="scanner-card">

            <div class="hero">

                <h1>🔒 API Security Scanner</h1>

                <p>
                    Analyze Security Headers, Swagger APIs,
                    JWT Tokens and OWASP Vulnerabilities
                </p>

            </div>

            <!-- Tabs -->
            <div class="tabs">

                <button id="apiTab" class="tab-btn active" onclick="showApiScanner()">

                    Headers Scanner

                </button>

                <button id="swaggerTab" class="tab-btn" onclick="showSwaggerScanner()">

                    Swagger API Scanner

                </button>

                <button id="jwtTab" class="tab-btn" onclick="showJwtScanner()">

                    JWT Scanner

                </button>

                <button id="owaspTab" class="tab-btn" onclick="showOwaspScanner()">

                    OWASP Scanner

                </button>

            </div>

            <!-- Header Scanner -->
            <div id="apiScanner">

                <input type="text" id="url" placeholder="Enter Website URL">
                <div id="urlError" class="error-message"></div>
                <button onclick="scanApi()">
                    Scan Headers
                </button>

                <button id="apiPdfBtn" onclick="downloadApiPdf()" style="display:none;">

                    Download PDF

                </button>

            </div>

            <!-- Swagger Scanner -->
            <div id="swaggerScanner" style="display:none;">

                <input type="text" id="swaggerUrl" placeholder="Enter Swagger/OpenAPI URL">
                <div id="swaggerError" class="error-message"></div>
                <button onclick="scanSwagger()">
                    Scan Swagger API
                </button>

                <button id="swaggerPdfBtn" onclick="downloadSwaggerPdf()" style="display:none;">

                    Download PDF

                </button>

            </div>
            <!-- JWT Scanner -->
            <div id="jwtScanner" style="display:none;">

                <textarea id="jwtToken" placeholder="Paste JWT Token Here" rows="6"
                    style="width:100%; margin-bottom:10px;">
                </textarea>
                <div id="jwtError" class="error-message"></div>
                <button onclick="scanJwt()">

                    Analyze JWT

                </button>

            </div>

            <!-- owaspScanner -->
            <div id="owaspScanner" style="display:none;">

                <input type="text" id="owaspUrl" placeholder="Enter Website URL">
                <div id="owaspError" class="error-message"></div>
                <button onclick="scanOwasp()">
                    Scan OWASP
                </button>

            </div>
            <button onclick="resetScanner()" class="refresh-btn">
                🔄 Reset Scanner
            </button>

            <div id="loader" class="loader">

            </div>

            <div id="result">

            </div>

        </div>

    </div>

    <footer class="footer">

        <p>🛡 CyberRadar v1.0</p>

        <p>
            Developed by
            <span class="developer-name">
                Swamy Dandu
            </span>
        </p>

        <p class="footer-tagline">
            Security Headers • JWT Analysis • Swagger Validation • OWASP Top 10
        </p>

    </footer>

    <script src="script.js"></script>


</body>

</html>
